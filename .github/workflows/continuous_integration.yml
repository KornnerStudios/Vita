name: CI

on:
  push:
    branches:
      - "master"
      - "dotnet8"
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  pull_request:
    branches:
      - "master"
      - "dotnet8"
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: Vita.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

  # To be used in msbuild props files
  ContinuousIntegrationBuild: true

  BUILD_PLATFORM: AnyCPU

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test Vita (${{ matrix.toolset.name }}, ${{ matrix.build-configuration }})
    runs-on: ${{ matrix.toolset.runner }}
    strategy:
      matrix:
        dotnet-version: [ '9.0.x' ]
        build-configuration: [ 'Debug', 'Release' ]
        toolset:
          - name: vs2022
            runner: windows-2022
          - name: vs2026
            runner: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        cache: true
        cache-dependency-path: "**/packages.lock.json"

    - name: Install dependencies
      # should not need to explicitly specify --locked-mode as ContinuousIntegrationBuild
      # should trigger RestoreLockedMode in the props files
      run: >-
        dotnet restore ${{ env.SOLUTION_FILE_PATH }}
        -p:Configuration=${{ matrix.build-configuration }}
        -p:Platform=${{ env.BUILD_PLATFORM }}

    - name: Build Vita AnyCPU
      working-directory: ${{ github.workspace }}
      run: >-
        dotnet build ${{ env.SOLUTION_FILE_PATH }}
        --configuration ${{ matrix.build-configuration }}
        -p:Platform=${{ env.BUILD_PLATFORM }}
        --no-restore
        -m

    # For MTP-specific arguments, the docs say to append them after an additional --
    # https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-test-mtp#forward-arguments-to-the-test-application
    # Since this is using `>-` the newlines are folded into spaces. The `--` is on the same line as the `--filter` argument.
    - name: Test
      run: >-
        dotnet test ${{ env.SOLUTION_FILE_PATH }}
        --configuration ${{ matrix.build-configuration }}
        -p:Platform=${{ env.BUILD_PLATFORM }}
        --no-build
        --no-restore
        --verbosity normal
        --
        --filter "TestCategory!=ExcludedFromAppveyor"

    - name: Print test logs on failure
      if: failure()
      shell: pwsh
      run: |
        $logs = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -File |
          Where-Object {
            $_.FullName -match '[\\/](TestResults)[\\/]' -and
            $_.Extension -in '.log', '.trx', '.xml'
          }

        if (!$logs) {
          Write-Host "No test result logs found."
          exit 0
        }

        foreach ($log in $logs) {
          Write-Host "::group::$($log.FullName)"
          Get-Content -LiteralPath $log.FullName -Raw
          Write-Host "::endgroup::"
        }
