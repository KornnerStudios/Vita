name: CI

on:
  push:
    branches: [ "master", "dotnet8", "main" ]
  pull_request:
    branches: [ "master", "dotnet8", "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: Vita.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Install dependencies
      run: dotnet restore

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'
        msbuild-architecture: x64

    #- name: Restore NuGet packages
    #  working-directory: ${{env.GITHUB_WORKSPACE}}
    #  run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    #- name: Build
    #  working-directory: ${{env.GITHUB_WORKSPACE}}
    #  # Add additional options to the MSBuild command line here (like platform or verbosity level).
    #  # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
    #  run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    # Build KSoft.T4 first. It is net481, while everything else is dotnet.
    # The point is to get KSoft.T4.dll built and available for the dotnet projects to use for T4 transformations.
    - name: Build KSoft.T4 Debug|AnyCPU
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild -restore -property:Platform=AnyCPU -property:Configuration=Debug KSoft/KSoft.T4/KSoft.T4.csproj

    - name: Build Vita Debug|AnyCPU
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild -restore -property:Platform=AnyCPU -property:Configuration=Debug ${{env.SOLUTION_FILE_PATH}}

    #- name: Build Vita Release|AnyCPU
    #  working-directory: ${{env.GITHUB_WORKSPACE}}
    #  run: msbuild -restore -property:Platform=AnyCPU -property:Configuration=Release ${{env.SOLUTION_FILE_PATH}}
