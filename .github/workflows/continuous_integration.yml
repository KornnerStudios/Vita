name: CI

on:
  push:
    branches:
      - "master"
      - "dotnet8"
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  pull_request:
    branches:
      - "master"
      - "dotnet8"
      - "main"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: Vita.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

  # To be used in msbuild props files
  ContinuousIntegrationBuild: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: [ '9.0.x' ]
        build-configuration: [ 'Debug', 'Release' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        # https://www.damirscorner.com/blog/posts/20240726-CachingNuGetPackagesInGitHubActions.html
        cache: true
        # setup-dotnet expects a single packages.lock.json file in the root by default,
        # but we have multiple projects in subdirectories
        cache-dependency-path: "**/packages.lock.json"

    - name: Install dependencies
      # should not need to explicitly specify --locked-mode as ContinuousIntegrationBuild
      # should trigger RestoreLockedMode in the props files
      run: dotnet restore

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'
        msbuild-architecture: x64

    # Build KSoft.T4 first. It is net481, while everything else is dotnet.
    # The point is to get KSoft.T4.dll built and available for the dotnet projects to use for T4 transformations.
    - name: Build KSoft.T4 AnyCPU
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: >-
        msbuild -property:Platform=AnyCPU -property:Configuration=${{ matrix.build-configuration }}
        KSoft/KSoft.T4/KSoft.T4.csproj

    - name: Build Vita AnyCPU
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: >-
        msbuild -property:Platform=AnyCPU -property:Configuration=${{ matrix.build-configuration }}
        -maxcpucount
        ${{env.SOLUTION_FILE_PATH}}

    - name: Test
      run: >-
        dotnet test --configuration ${{ matrix.build-configuration }}
        --verbosity normal
        --filter "TestCategory!=ExcludedFromAppveyor"
